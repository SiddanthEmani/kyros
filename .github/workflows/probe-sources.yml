name: probe-sources

# TEMPORARY: captures raw responses from candidate sources so parsers can be
# written against real markup. Removed once the parsers land.
on:
  push:
    branches: [claude/event-sources-research-kucu5x]
    paths: [.github/workflows/probe-sources.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch
        run: |
          set +e
          mkdir -p probe
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          while read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sSL -m 30 -A "$UA" -H "Accept-Language: en-US,en;q=0.9" \
              -o "probe/$name" -w "%{http_code} %{size_download} %{content_type} %{url_effective}" "$url")
            echo "$name $code" | tee -a probe/_index.txt
          done <<'URLS'
          vsj_listings.json https://www.sanjose.org/event-listings
          sjd_feed.xml https://sjdowntown.com/dtsj-events/feed/
          cv_pull_100.json https://api.cerebralvalley.ai/v1/public/event/pull?approved=true&limit=100&offset=0&startDateTime=2026-09-28T07:00:00.000Z
          cv_pull_sf.json https://api.cerebralvalley.ai/v1/public/event/pull?approved=true&limit=100&offset=0&startDateTime=2026-09-28T07:00:00.000Z&location=San%20Francisco%2C%20CA
          URLS
          # Where do Cerebral Valley's bundles call the events API?
          for u in $(grep -oE '/_next/static/chunks/[^"?]+\.js' tests/fixtures/_probe/cv_events.html | sort -u); do
            curl -s -m 20 -A "$UA" "https://cerebralvalley.ai$u" | grep -oE '.{0,300}(fetchEventLocationFilter|event/locations|location_filter|locationFilter).{0,400}' >> probe/cv_js_snippets2.txt
          done
          ls -la probe
      - name: Commit
        run: |
          git config user.name  "kyros-bot"
          git config user.email "kyros-bot@users.noreply.github.com"
          mkdir -p tests/fixtures/_probe && cp probe/* tests/fixtures/_probe/
          git add tests/fixtures/_probe
          git commit -m "probe: raw source captures (3)" && git push
