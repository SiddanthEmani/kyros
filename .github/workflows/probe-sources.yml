name: probe-sources

# TEMPORARY: captures raw responses from candidate sources so parsers can be
# written against real markup. Removed once the parsers land.
on:
  push:
    branches: [claude/event-sources-research-kucu5x]
    paths: [.github/workflows/probe-sources.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch
        run: |
          set +e
          mkdir -p probe
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          while read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sSL -m 30 -A "$UA" -H "Accept-Language: en-US,en;q=0.9" \
              -o "probe/$name" -w "%{http_code} %{size_download} %{content_type} %{url_effective}" "$url")
            echo "$name $code" | tee -a probe/_index.txt
          done <<'URLS'
          sjd_ical.ics https://sjdowntown.com/dtsj-events/?ical=1
          sjd_list.ics https://sjdowntown.com/dtsj-events/list/?ical=1
          sjd_tribe.json https://sjdowntown.com/wp-json/tribe/events/v1/events?per_page=50
          stanford.json https://events.stanford.edu/api/2/events?days=30&pp=100
          stanford_types.json https://events.stanford.edu/api/2/events/filters
          dtb_events.html https://dothebay.com/events
          dtb_day.html https://dothebay.com/events/2026/10/3
          dtb_json.json https://dothebay.com/events.json
          dtb_today_json.json https://dothebay.com/events/today.json
          dtb_music.html https://dothebay.com/events/music
          cv_events.html https://cerebralvalley.ai/events
          cv_api.json https://api.cerebralvalley.ai/v1/public/event/pull
          vsj_events.html https://www.sanjose.org/events
          vsj_token.txt https://www.sanjose.org/plugins/core/get_simple_token/
          URLS
          # Visit San Jose is Simpleview: the listing is fetched client-side
          # with a short-lived token.
          tok=$(cat probe/vsj_token.txt | tr -d '"\n ')
          q='{"filter":{"active":true,"$and":[{"categories.catId":{"$exists":true}}],"date_range":{"start":{"$date":"2026-09-28T07:00:00.000Z"},"end":{"$date":"2026-10-28T07:00:00.000Z"}}},"options":{"limit":50,"skip":0,"count":true,"castDocs":false,"fields":{"categories":1,"endDate":1,"featured":1,"host_id":1,"latitude":1,"longitude":1,"location":1,"media_raw":1,"nextDate":1,"rank":1,"recid":1,"recurType":1,"recurrence":1,"startDate":1,"startTime":1,"endTime":1,"title":1,"typeName":1,"url":1,"address1":1,"city":1,"admission":1,"listing.title":1,"listing.url":1},"sort":{"featured":-1,"nextDate":1,"rank":1,"title_sort":1}}}'
          curl -sS -m 30 -A "$UA" -G "https://www.sanjose.org/includes/rest_v2/plugins_events_events_by_date/find/" \
            --data-urlencode "json=$q" --data-urlencode "token=$tok" -o probe/vsj_find.json \
            -w "vsj_find.json %{http_code} %{size_download}\n" | tee -a probe/_index.txt
          ls -la probe
      - name: Commit
        run: |
          git config user.name  "kyros-bot"
          git config user.email "kyros-bot@users.noreply.github.com"
          mkdir -p tests/fixtures/_probe && cp probe/* tests/fixtures/_probe/
          git add tests/fixtures/_probe
          git commit -m "probe: raw source captures" && git push
