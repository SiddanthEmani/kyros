name: pr-check

# Runs on every commit pushed to a PR. Two things are checked: the offline
# test suite, and the real pipeline against the live sources — the parsers
# scrape hand-maintained pages, so "still parses today's markup" is not
# something unit tests can answer.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs when a PR gets a new commit.
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Unit tests (offline, fixture-driven)
        run: python -m pytest -q

      - name: Pipeline against fixtures
        run: python run.py --offline --dry-run --require-events 1

      # The live run. --dry-run writes no feeds and commits nothing, so this
      # is safe on any PR. The report lands in the job summary so a failure
      # can be diagnosed without opening the raw log.
      #
      # On a PR from a fork the secret is absent by design; the Ticketmaster
      # source then skips itself and the rest still has to pass.
      - name: Pipeline against live sources
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          python run.py --dry-run --explain \
            --report "$GITHUB_STEP_SUMMARY" \
            --require-events 1
