name: live-check

# TEMPORARY: runs pr-check's live dry run on this branch. Removed after.
on:
  push:
    branches: [claude/event-sources-research-kucu5x]
    paths: [.github/workflows/live-check.yml]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python run.py --offline --dry-run --require-events 1
      - name: Pipeline against live sources
        run: |
          python run.py --dry-run --explain \
            --report "$GITHUB_STEP_SUMMARY" \
            --require-events 1
