name: kyros-refresh

on:
  schedule:
    # Every 6 hours: 00, 06, 12, 18 UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kyros-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Sync with the branch being built
        run: |
          git config user.name  "kyros-bot"
          git config user.email "kyros-bot@users.noreply.github.com"
          # Pull the branch we are on, not main. actions/checkout clones
          # shallow, so rebasing onto another branch's truncated history
          # makes every file common to both an add/add conflict. On main
          # this is the same no-op fast path it always was.
          git pull --rebase --quiet origin "$GITHUB_REF_NAME"

      - name: Build feeds
        env:
          # Optional: without it the Ticketmaster source skips itself and
          # the rest of the feed still builds.
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python run.py --ics-path events.ics --explain

      - name: Commit if changed
        run: |
          # Stage first: feeds/*.ics are untracked on the first run, and
          # `git diff` alone would not see them.
          git add events.ics feeds/
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "kyros: refresh feeds ($(date -u +'%Y-%m-%dT%H:%MZ'))"
          git push
